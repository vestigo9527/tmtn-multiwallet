<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫码登录 · 钱包</title>
<style>
  :root {
    --bg: #0b0e14; --card: #141924; --line: #232a3a; --text: #e6e9f0; --dim: #8b95a8;
    --on: #35d07f; --warn: #f0b429; --bad: #ef5350; --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #16203a, var(--bg)); color: var(--text);
    font: 15px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; padding: 24px; }
  .card { width: min(460px, 100%); background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 26px; box-shadow: 0 24px 60px rgba(0,0,0,.45); text-align: center; }
  h1 { margin: 0 0 4px; font-size: 19px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; word-break: break-all; }
  .qrbox { width: 288px; height: 288px; margin: 0 auto 16px; border-radius: 14px; background: #fff;
    padding: 10px; display: flex; align-items: center; justify-content: center; }
  .qrbox img { width: 100%; height: 100%; display: block; }
  .qrbox .ph { color: #55607a; font-size: 13px; line-height: 1.7; }
  .qrbox.done { background: #0f1f18; border: 1px solid #1f5a3c; }
  .big { font-size: 64px; line-height: 1; color: var(--on); }
  .spin { width: 28px; height: 28px; border: 3px solid #d5dbe8; border-top-color: var(--accent);
    border-radius: 50%; animation: sp .9s linear infinite; margin: 0 auto 10px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .pair { font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .pair b { color: var(--text); font-size: 22px; letter-spacing: 4px; font-family: ui-monospace, monospace; }
  .state { margin-top: 12px; font-size: 14px; padding: 10px 14px; border-radius: 10px;
    background: #10141d; border: 1px solid var(--line); }
  .state.on { color: var(--on); border-color: #1f5a3c; background: #0f1f18; }
  .state.warn { color: var(--warn); border-color: #4a3a12; background: #1c1710; }
  .state.bad { color: var(--bad); border-color: #4a1f1f; background: #1d1213; }
  .row { margin-top: 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, a.btn { font: inherit; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line);
    background: #1b2230; color: var(--text); cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04101f; font-weight: 600; }
  button.ghost { background: transparent; color: var(--dim); font-size: 13px; }
  .tip { margin-top: 16px; color: var(--dim); font-size: 12px; line-height: 1.8; text-align: left; }
  .tip b { color: #b9c3d6; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">钱包 1 · 扫码登录</h1>
  <div class="sub" id="sub">币安 Agentic Wallet</div>

  <div class="qrbox" id="qrbox"><div class="ph"><div class="spin"></div>正在取码…<br>约 10 秒</div></div>

  <div class="pair" id="pair" style="display:none">配对码 <b id="code">------</b></div>
  <div class="state" id="state">正在取码…</div>

  <div class="row">
    <button id="retry" class="primary" style="display:none">换一张二维码</button>
    <button id="relogin" class="ghost" style="display:none">重新登录（会踢掉当前会话）</button>
    <a class="btn" id="back" href="/">回到管理台</a>
  </div>

  <div class="tip">
    <b>怎么扫：</b>打开币安 App → 右上角「扫一扫」→ 扫上面的二维码 → 在手机上点确认。<br>
    <b>扫完这里会自动变成「已登录」</b>，管理台那一页也会同步刷新，不用手动刷新。<br>
    <b>一张码 5 分钟有效</b>；过期了点「换一张二维码」。
  </div>
</div>

<script>
const slot = Number(new URLSearchParams(location.search).get('slot') || 1);
const $ = (id) => document.getElementById(id);
const chan = ('BroadcastChannel' in window) ? new BroadcastChannel('wallet-manager') : null;
let curUrl = '', shownUrl = '', busy = false, done = false;

const setState = (t, cls = '') => { const el = $('state'); el.textContent = t; el.className = 'state ' + cls; };
const showQR = (url) => {
  if (!url || url === shownUrl) return;
  shownUrl = url;
  $('qrbox').className = 'qrbox';
  $('qrbox').innerHTML = '<img alt="二维码" src="/api/qr.svg?slot=' + slot + '&t=' + Date.now() + '">';
};
const showDone = (addr) => {
  done = true;
  $('qrbox').className = 'qrbox done';
  $('qrbox').innerHTML = '<div><div class="big">✓</div><div style="color:#7fd6a4;font-size:14px;margin-top:8px">已登录</div></div>';
  $('pair').style.display = 'none';
  $('retry').style.display = 'none';
  $('relogin').style.display = '';
  setState('已登录 ✓' + (addr ? ' · ' + addr.slice(0, 10) + '…' + addr.slice(-6) : ''), 'on');
  $('sub').textContent = '这个钱包已经登录，不需要再扫码；确实要换号才点「重新登录」';
  chan && chan.postMessage({ type: 'signed-in', slot });
};
const showPending = () => {
  $('qrbox').className = 'qrbox';
  $('qrbox').innerHTML = '<div class="ph"><div class="spin"></div>正在取码…<br>约 10 秒</div>';
  setState('正在取码…');
};

// 以「后端真实登录态」为准，会话文件只用来判断有没有活码：
// 会话文件里 residue 的 SUCCESS 不能当成已登录（手机端退出登录后文件还在）。
async function poll() {
  try {
    const [stRes, sessRes] = await Promise.all([
      fetch('/api/state', { cache: 'no-store' }).catch(() => null),
      fetch('/api/session?slot=' + slot, { cache: 'no-store' }).catch(() => null),
    ]);
    const st = stRes ? await stRes.json() : null;
    const r = sessRes ? await sessRes.json() : {};
    const w = st && st.wallets && st.wallets.find((x) => x.slot === slot);

    if (w && w.auth === 'ok') { showDone(w.address); return; }

    // 未登录：这时候才看二维码
    done = false;
    if (r.status === 'waiting' && r.urlForWeb) {
      curUrl = r.urlForWeb; showQR(r.urlForWeb);
      $('pair').style.display = ''; $('code').textContent = r.pairingCode || '------';
      const left = Math.max(0, Math.round((r.expireAt - Date.now()) / 1000));
      setState('等扫码 · 剩余 ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'));
      $('retry').style.display = 'none';
      return;
    }
    if (r.status === 'expired') {
      setState('二维码过期了，点下面「换一张二维码」', 'warn');
      $('retry').style.display = '';
      return;
    }
    if (r.status === 'failed') {
      setState('取码失败：' + String(r.raw || '看 data/qr-' + slot + '.log').slice(0, 140), 'bad');
      $('retry').style.display = '';
      return;
    }
    // 没有活码（或文件里的状态已过期但钱包其实没登录）→ 显示取码中，并给一个手动换码按钮
    showPending();
    $('retry').style.display = '';
  } catch (e) {
    setState('连不上管理台：' + e.message, 'bad');
  }
}

async function kick(relogin) {
  if (busy) return; busy = true;
  $('retry').disabled = true;
  setState(relogin ? '正在踢掉旧会话并取新码…' : '正在换一张…');
  shownUrl = ''; done = false;
  try {
    await fetch('/api/signin', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ slot, relogin: !!relogin }) });
  } catch {}
  $('retry').disabled = false; busy = false;
  poll();
}
$('retry').onclick = () => kick(false);
$('relogin').onclick = () => { if (confirm('会先退出当前会话，再去手机扫码。确定？')) kick(true); };

(async () => {
  const st = await fetch('/api/state', { cache: 'no-store' }).then((x) => x.json()).catch(() => null);
  const w = st && st.wallets && st.wallets.find((x) => x.slot === slot);
  if (w) {
    $('title').textContent = '钱包 ' + slot + ' · ' + (w.label || '未命名');
    $('sub').textContent = (w.address || '未登录') + (w.live ? ' · 实盘' : ' · 只报价');
    if (w.auth === 'ok') { curUrl = w.address || ''; showDone(w.address); return; }
  }
  poll();
  setInterval(() => { if (!done) poll(); }, 1500);
})();
</script>
</body>
</html>
